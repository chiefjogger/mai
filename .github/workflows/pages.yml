# Deploy the static files as-is. The legacy Jekyll builder kept timing out
# on this repo; this uploads the directory directly and skips it entirely.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue overlapping runs instead of cancelling. With cancel-in-progress the
# newer run kills the older one mid-deploy and deploy-pages reports
# "Deployment cancelled", which is not a build failure but looks like one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The artifact uploads in seconds, but GitHub's Pages queue has been
      # sitting on deployments for this repo well past the action's 10-minute
      # default, which aborts a deploy that would otherwise land. Give it 30.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
