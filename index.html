<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!-- không khoá maximum-scale: chặn pinch-zoom là vi phạm WCAG 1.4.4.
     Safari iOS tự zoom khi focus input dưới 16px, nên ô nhập đã nâng lên 16px. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F4ED" />
<title>m.ai · v19</title>
<meta name="description" content="m.ai — trợ lý gia đình. Demo v19, Mai trả lời ngay trên máy." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F7F4ED; -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #F7F4ED; color: #6E665C; z-index: 9999;
    font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "three": "https://esm.sh/three@0.160.1",
    "lucide-react": "https://esm.sh/lucide-react@0.395.0?external=react"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<div id="boot">Đang tải m.ai…</div>

<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
  window.addEventListener("error", function (e) {
    var b = document.getElementById("boot");
    if (b && !b.classList.contains("gone")) b.textContent = "Không tải được: " + (e.message || "lỗi không rõ");
  });
  new MutationObserver(function (_, obs) {
    if (document.getElementById("root").childNodes.length) {
      document.getElementById("boot").classList.add("gone");
      obs.disconnect();
    }
  }).observe(document.getElementById("root"), { childList: true });
</script>
<script>
  // Inject app.jsx rather than hard-coding the tag, so a local run can bust the
  // cache. Without this the browser happily serves a stale app.jsx while the
  // file on disk has changed — which makes every measurement taken against it
  // a lie. Production keeps the clean URL so the 220KB stays cacheable.
  (function () {
    var dev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    var s = document.createElement("script");
    s.type = "text/babel";
    s.setAttribute("data-type", "module");
    s.setAttribute("data-presets", "react");
    s.src = "./app.jsx" + (dev ? "?t=" + Date.now() : "");
    s.onload = function () { Babel.transformScriptTags(); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
